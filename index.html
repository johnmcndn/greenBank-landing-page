<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenBank</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="/" class="logo">
          <img src="./assets/images/logo.webp" alt="GreenBank Logo" />
        </a>

        <nav aria-label="Main">
          <ul>
            <li><a href="#why-us">Why Us</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#process">Our Process</a></li>
            <li><a href="#payments">Payments</a></li>
            <li><a href="#faqs">FAQs</a></li>
          </ul>
        </nav>

        <a href="#contact" class="btn btn-outline">Contact</a>
      </div>
    </header>
    <main>
      <section class="site-hero">
        <div class="container">
          <div class="heroContent">
            <h1>Discover the Perfect Credit Card for You</h1>
            <p class="heroDescription">
              Discover the power of our secure and rewarding credit cards.
              Explore our range of credit cards and take control of your
              finances today.
            </p>
            <a class="btnGetStarted">
              Get Started
              <img
                src="./assets/images/arrow.webp"
                width="1"
                height="1"
                alt="Arrow"
              />
            </a>
            <div class="usersActive">
              <div class="usersProfile">
                <img
                  src="./assets/images/avatar1.webp"
                  alt="Avatar"
                  class="avatar"
                />
                <img
                  src="./assets/images/avatar2.webp"
                  alt="Avatar"
                  class="avatar"
                />
                <img
                  src="./assets/images/avatar3.webp"
                  alt="Avatar"
                  class="avatar"
                />
              </div>
              <p class="userDesc">
                10.2k+ <span>Active users around the world</span>
              </p>
            </div>
          </div>
          <div class="heroVisual">
            <img
              src="./assets/images/circle.webp"
              alt=""
              class="heroVisualBlob"
            />
            <img
              src="./assets/images/credit-card.webp"
              alt="GreenBank credit card"
              class="heroVisualCard"
            />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
